<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANK | Secure Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="login-page">
<div class="login-shell">
  <section class="brand-panel"><div class="brand-mark">B</div><h1>BANK</h1><p>Credit & financial services portal</p></section>
  <section class="login-card"><div class="eyebrow">SECURE ACCESS</div><h2>Welcome back</h2><p class="muted">Sign in to continue.</p>
    <div class="role-switch"><button class="role active" data-role="customer">Customer</button><button class="role" data-role="staff">Staff</button><button class="role" data-role="developer">Developer</button></div>
    <form id="loginForm"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary full">Sign in</button></form>
    <p id="loginMsg" class="message"></p><p class="hint" id="roleHint">Customer: any username and password.</p>
  </section>
</div><script src="js/app.js"></script></body></html>
