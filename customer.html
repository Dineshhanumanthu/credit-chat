<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BANK | Customer</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><div class="logo">BANK</div><div><span id="userLabel"></span><button class="ghost" onclick="logout()">Sign out</button></div></header>
<main class="container"><div class="page-head"><div><div class="eyebrow">CUSTOMER PORTAL</div><h1>Loan application</h1><p class="muted">Enter your details to discover suitable loan and banking products.</p></div></div>
<section class="grid-2"><form id="customerForm" class="card form-grid">
<h3>Personal details</h3><label>Age<input name="person_age" type="number" min="18" required></label><label>Annual income<input name="person_income" type="number" min="1" required></label><label>Home ownership<select name="person_home_ownership"><option>RENT</option><option>MORTGAGE</option><option>OWN</option><option>OTHER</option></select></label><label>Employment length<input name="person_emp_length" type="number" min="0" step="0.1" required></label><label>Credit history length<input name="cb_person_cred_hist_length" type="number" min="0" required></label><label>Previous default<select name="cb_person_default_on_file"><option>N</option><option>Y</option></select></label>
<h3>Loan details</h3><label>Loan purpose<select name="loan_intent"><option>PERSONAL</option><option>EDUCATION</option><option>MEDICAL</option><option>HOMEIMPROVEMENT</option><option>DEBTCONSOLIDATION</option><option>VENTURE</option></select></label><label>Loan grade<select name="loan_grade"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option></select></label><label>Loan amount<input name="loan_amnt" type="number" min="1" required></label><label>Interest rate<input name="loan_int_rate" type="number" min="0" step="0.01" required></label><label>Loan % of income<input name="loan_percent_income" type="number" min="0" step="0.01" required></label><label>Loan tenure (months)<input name="loan_tenure" type="number" min="1" value="36" required></label><label>Existing EMI<input name="existing_emi" type="number" min="0" value="0" required></label>
<button class="primary full" type="submit">Check recommendations</button><p id="customerMsg" class="message"></p></form>
<aside class="card recommendation" id="recommendation"><div class="eyebrow">RECOMMENDATIONS</div><h2>Your options</h2><p class="muted">Complete the form to see suitable products.</p></aside></section></main><script src="js/app.js"></script></body></html>
