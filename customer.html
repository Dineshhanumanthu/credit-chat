<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank | Customer</title>

  <!-- Files are in the repository root -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">BANK</div>

    <div>
      <span id="userLabel"></span>
      <button class="ghost" onclick="logout()">Sign out</button>
    </div>
  </header>

  <main class="container">

    <div class="page-head">
      <div>
        <div class="eyebrow">CUSTOMER PORTAL</div>
        <h1>Loan application</h1>
        <p class="muted">
          Enter your details to discover suitable loan and banking products.
        </p>
      </div>
    </div>

    <section class="grid-2">

      <form id="customerForm" class="card form-grid">

        <h3>Personal details</h3>

        <label>
          Age
          <input
            name="person_age"
            type="number"
            min="18"
            max="100"
            required
          >
        </label>

        <label>
          Annual income
          <input
            name="person_income"
            type="number"
            min="1"
            required
          >
        </label>

        <label>
          Home ownership
          <select name="person_home_ownership">
            <option value="RENT">RENT</option>
            <option value="MORTGAGE">MORTGAGE</option>
            <option value="OWN">OWN</option>
            <option value="OTHER">OTHER</option>
          </select>
        </label>

        <label>
          Employment length
          <input
            name="person_emp_length"
            type="number"
            min="0"
            max="80"
            step="0.1"
            required
          >
        </label>

        <label>
          Credit history length
          <input
            name="cb_person_cred_hist_length"
            type="number"
            min="0"
            max="100"
            required
          >
        </label>

        <label>
          Previous default
          <select name="cb_person_default_on_file">
            <option value="N">N</option>
            <option value="Y">Y</option>
          </select>
        </label>

        <h3>Loan details</h3>

        <label>
          Loan purpose
          <select name="loan_intent">
            <option value="PERSONAL">PERSONAL</option>
            <option value="EDUCATION">EDUCATION</option>
            <option value="MEDICAL">MEDICAL</option>
            <option value="HOMEIMPROVEMENT">HOMEIMPROVEMENT</option>
            <option value="DEBTCONSOLIDATION">DEBTCONSOLIDATION</option>
            <option value="VENTURE">VENTURE</option>
          </select>
        </label>

        <label>
          Loan grade
          <select name="loan_grade">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="G">G</option>
          </select>
        </label>

        <label>
          Loan amount
          <input
            name="loan_amnt"
            type="number"
            min="1"
            required
          >
        </label>

        <label>
          Interest rate
          <input
            name="loan_int_rate"
            type="number"
            min="0"
            step="0.01"
            required
          >
        </label>

        <label>
          Loan % of income
          <input
            name="loan_percent_income"
            type="number"
            min="0"
            step="0.01"
            required
          >
        </label>

        <label>
          Loan tenure (months)
          <input
            name="loan_tenure"
            type="number"
            min="1"
            max="120"
            value="36"
            required
          >
        </label>

        <label>
          Existing EMI
          <input
            name="existing_emi"
            type="number"
            min="0"
            value="0"
            required
          >
        </label>

        <button
          class="primary full"
          type="submit"
        >
          Check recommendations
        </button>

        <p
          id="customerMsg"
          class="message"
        ></p>

      </form>


      <aside
        class="card recommendation"
        id="recommendation"
      >

        <div class="eyebrow">
          RECOMMENDATIONS
        </div>

        <h2>Your options</h2>

        <p class="muted">
          Complete the form to see suitable products.
        </p>

      </aside>

    </section>

  </main>

  <!-- JavaScript is also in the repository root -->
  <script src="app.js"></script>

</body>
</html>
